name: Desktop app (FREYRAUM Editor)

# v1.39 — builds the FREYRAUM Editor desktop app. Separate from the Pages
# deploy: deploy-pages.yml never downloads Electron.
#   - pull requests touching the app: build + Electron test (Linux)
#   - tag `desktop-vX.Y.Z` (must match desktop/package.json "version"):
#     test, then Windows (installer + portable) and macOS (dmg, Intel + Apple
#     Silicon) builds, uploaded to a GitHub Release.
# Signing is optional (see docs/DESKTOP_APP.md); without the secrets the
# builds are unsigned and the customer confirms a one-time warning.

on:
  push:
    tags:
      - 'desktop-v*'
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/local-project/**'
      - 'scripts/import-artworks.mjs'
      - 'scripts/test-desktop-app.mjs'
      - 'src/online/**'
      - 'src/hub/editor/onlineEditor.ts'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm run import:artworks
      - run: npm run build
      - run: npm run test:local-project
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Typecheck and build the desktop app
        working-directory: desktop
        run: |
          npm run typecheck
          npm run build
      - name: Electron test
        run: |
          npm i --no-save playwright
          xvfb-run -a npm run test:desktop-app

  build:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: dist:win
          - os: macos-latest
            target: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Check tag matches desktop/package.json version
        shell: bash
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          if [ "desktop-v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match desktop/package.json version $VERSION." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run import:artworks
      - run: npm run build
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      # Only secrets that are set are passed on; empty values would make
      # electron-builder try (and fail) to sign.
      - name: Optional signing configuration
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          add() { if [ -n "$2" ]; then { echo "$1<<__FREYRAUM_EOF__"; echo "$2"; echo "__FREYRAUM_EOF__"; } >> "$GITHUB_ENV"; fi; }
          if [ "$RUNNER_OS" = "Windows" ]; then
            add WIN_CSC_LINK "$WIN_CSC_LINK"
            add WIN_CSC_KEY_PASSWORD "$WIN_CSC_KEY_PASSWORD"
          else
            add CSC_LINK "$MAC_CSC_LINK"
            add CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD"
            add APPLE_ID "$APPLE_ID"
            add APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD"
            add APPLE_TEAM_ID "$APPLE_TEAM_ID"
            if [ -z "$MAC_CSC_LINK" ]; then echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"; fi
          fi
      - name: Build installers
        working-directory: desktop
        run: npm run ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: freyraum-editor-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "FREYRAUM Editor ${GITHUB_REF_NAME#desktop-v}" \
            --notes "FREYRAUM Editor ${GITHUB_REF_NAME#desktop-v}. Windows: FREYRAUM-Editor-Setup-*.exe (Installation) oder *-portable.exe (ohne Installation). macOS: *-arm64.dmg (Apple-Chip) oder *-x64.dmg (Intel). Anleitung: docs/CUSTOMER_PICTURE_GUIDE.md → FREYRAUM Editor (App)."
