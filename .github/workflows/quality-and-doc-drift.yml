name: Quality and Documentation Drift

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run docs:check-config-authority
      - run: npm run lint
      - run: npm run build:typecheck
      - run: npm run build
      - run: npm run validate:museum-hub
      - run: npm run test --if-present
      - name: npm audit (moderate)
        run: npm audit --audit-level=moderate
        continue-on-error: true
