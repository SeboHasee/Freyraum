<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="FREYRAUM v0.01 architecture diagram">
  <title>FREYRAUM v0.01 architecture</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f3"/>
      <stop offset="1" stop-color="#bcc5cc"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="block-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12171b"/>
      <stop offset="1" stop-color="#2a363f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4750"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="60" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#12171b" letter-spacing="-1.2">FREYRAUM v0.01 — Architecture</text>
  <text x="60" y="88" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#4a5568" letter-spacing="2" text-transform="uppercase">LAUNCHER · BUILD · APP · A11Y · PERFORMANCE · DOCUMENTATION</text>

  <!-- Customer launcher -->
  <g>
    <rect x="60" y="130" width="280" height="100" rx="22" fill="url(#block)" stroke="rgba(0,0,0,0.18)"/>
    <text x="80" y="162" font-family="Inter" font-size="14" font-weight="700" fill="#12171b">Customer Launcher</text>
    <text x="80" y="184" font-family="Inter" font-size="12" fill="#4a5568">index.html (root)</text>
    <text x="80" y="204" font-family="Inter" font-size="11" fill="#4a5568">→ committed customer-preview/app.html</text>
    <text x="80" y="220" font-family="Inter" font-size="11" fill="#4a5568">file:// double-click safe</text>
  </g>

  <!-- Vite dev entry -->
  <g>
    <rect x="380" y="130" width="280" height="100" rx="22" fill="url(#block)" stroke="rgba(0,0,0,0.18)"/>
    <text x="400" y="162" font-family="Inter" font-size="14" font-weight="700" fill="#12171b">Vite Dev Entry</text>
    <text x="400" y="184" font-family="Inter" font-size="12" fill="#4a5568">app.html · npm run dev</text>
    <text x="400" y="204" font-family="Inter" font-size="11" fill="#4a5568">Module graph, HMR, TS strict</text>
  </g>

  <!-- Build pipeline -->
  <g>
    <rect x="700" y="130" width="440" height="100" rx="22" fill="url(#block)" stroke="rgba(0,0,0,0.18)"/>
    <text x="720" y="162" font-family="Inter" font-size="14" font-weight="700" fill="#12171b">Build Pipeline · npm run build</text>
    <text x="720" y="184" font-family="Inter" font-size="11" fill="#4a5568">1. tsc (strict typecheck)</text>
    <text x="720" y="200" font-family="Inter" font-size="11" fill="#4a5568">2. vite build --config vite.local.config.ts (IIFE)</text>
    <text x="720" y="216" font-family="Inter" font-size="11" fill="#4a5568">3. scripts/write-local-preview.mjs (HTML + crypto patch)</text>
  </g>

  <!-- App core box -->
  <g>
    <rect x="60" y="270" width="1080" height="280" rx="26" fill="rgba(255,255,255,0.55)" stroke="rgba(0,0,0,0.18)"/>
    <text x="80" y="298" font-family="Inter" font-size="15" font-weight="700" fill="#12171b" letter-spacing="1">APP CORE  ·  src/main.ts</text>

    <!-- Layer: renderer & scene -->
    <g>
      <rect x="80" y="316" width="240" height="216" rx="18" fill="url(#block)" stroke="rgba(0,0,0,0.14)"/>
      <text x="98" y="342" font-family="Inter" font-size="12" font-weight="700" fill="#12171b">Rendering</text>
      <text x="98" y="362" font-family="Inter" font-size="11" fill="#4a5568">RendererManager</text>
      <text x="98" y="378" font-family="Inter" font-size="11" fill="#4a5568">SceneManager</text>
      <text x="98" y="394" font-family="Inter" font-size="11" fill="#4a5568">PostProcessing (Bloom)</text>
      <text x="98" y="410" font-family="Inter" font-size="11" fill="#4a5568">LightingSetup</text>
      <text x="98" y="426" font-family="Inter" font-size="11" fill="#4a5568">TextureManager</text>
      <text x="98" y="442" font-family="Inter" font-size="11" fill="#4a5568">ArtworkMesh · SidePanels</text>
      <text x="98" y="476" font-family="Inter" font-size="10" fill="#4a5568" font-style="italic">applyPreset(QualityPreset)</text>
      <text x="98" y="492" font-family="Inter" font-size="10" fill="#4a5568" font-style="italic">setReducedMotion / setAnimated</text>
    </g>

    <!-- Layer: gallery -->
    <g>
      <rect x="340" y="316" width="240" height="216" rx="18" fill="url(#block)" stroke="rgba(0,0,0,0.14)"/>
      <text x="358" y="342" font-family="Inter" font-size="12" font-weight="700" fill="#12171b">Gallery Logic</text>
      <text x="358" y="362" font-family="Inter" font-size="11" fill="#4a5568">GalleryManager</text>
      <text x="358" y="378" font-family="Inter" font-size="11" fill="#4a5568">Zoom + Pan clamping</text>
      <text x="358" y="394" font-family="Inter" font-size="11" fill="#4a5568">Aspect-aware fitting</text>
      <text x="358" y="410" font-family="Inter" font-size="11" fill="#4a5568">resetView() · navigate()</text>
      <text x="358" y="442" font-family="Inter" font-size="11" fill="#4a5568">config/artworks.ts</text>
      <text x="358" y="458" font-family="Inter" font-size="10" fill="#4a5568" font-style="italic">id · title · medium · year</text>
      <text x="358" y="474" font-family="Inter" font-size="10" fill="#4a5568" font-style="italic">dimensions · alt · credit · tags</text>
    </g>

    <!-- Layer: interaction -->
    <g>
      <rect x="600" y="316" width="240" height="216" rx="18" fill="url(#block)" stroke="rgba(0,0,0,0.14)"/>
      <text x="618" y="342" font-family="Inter" font-size="12" font-weight="700" fill="#12171b">Interaction</text>
      <text x="618" y="362" font-family="Inter" font-size="11" fill="#4a5568">MouseInteraction</text>
      <text x="618" y="378" font-family="Inter" font-size="11" fill="#4a5568">ZoomPan (wheel · drag)</text>
      <text x="618" y="394" font-family="Inter" font-size="11" fill="#4a5568">TouchInteraction (pinch · pan · swipe)</text>
      <text x="618" y="410" font-family="Inter" font-size="11" fill="#4a5568">KeyboardNav</text>
      <text x="618" y="442" font-family="Inter" font-size="10" fill="#4a5568" font-style="italic">Arrows · +/- · 0/R · F</text>
      <text x="618" y="458" font-family="Inter" font-size="10" fill="#4a5568" font-style="italic">Roving tabindex (timeline)</text>
    </g>

    <!-- Layer: UI -->
    <g>
      <rect x="860" y="316" width="260" height="216" rx="18" fill="url(#block)" stroke="rgba(0,0,0,0.14)"/>
      <text x="878" y="342" font-family="Inter" font-size="12" font-weight="700" fill="#12171b">UI / DOM</text>
      <text x="878" y="362" font-family="Inter" font-size="11" fill="#4a5568">Topbar · InfoPanel</text>
      <text x="878" y="378" font-family="Inter" font-size="11" fill="#4a5568">NavigationControls</text>
      <text x="878" y="394" font-family="Inter" font-size="11" fill="#4a5568">ZoomControls · Reset</text>
      <text x="878" y="410" font-family="Inter" font-size="11" fill="#4a5568">FullscreenButton</text>
      <text x="878" y="426" font-family="Inter" font-size="11" fill="#4a5568">PreferencesPanel</text>
      <text x="878" y="442" font-family="Inter" font-size="11" fill="#4a5568">Timeline (buttons + skeleton)</text>
      <text x="878" y="458" font-family="Inter" font-size="11" fill="#4a5568">FallbackScreen</text>
      <text x="878" y="492" font-family="Inter" font-size="10" fill="#4a5568" font-style="italic">SCSS tokens + a11y modes</text>
    </g>
  </g>

  <!-- A11y / preferences bar -->
  <g>
    <rect x="60" y="580" width="540" height="140" rx="22" fill="url(#block-accent)"/>
    <text x="80" y="610" font-family="Inter" font-size="14" font-weight="700" fill="#ffffff">Accessibility &amp; Preferences</text>
    <text x="80" y="634" font-family="Inter" font-size="11" fill="#e7eaee">utils/preferences.ts (localStorage)</text>
    <text x="80" y="652" font-family="Inter" font-size="11" fill="#e7eaee">utils/webgl.ts (feature detection)</text>
    <text x="80" y="670" font-family="Inter" font-size="11" fill="#e7eaee">prefers-reduced-motion · prefers-contrast</text>
    <text x="80" y="690" font-family="Inter" font-size="11" fill="#e7eaee">data-motion · data-contrast · data-quality · data-presentation</text>
  </g>

  <!-- Quality presets -->
  <g>
    <rect x="620" y="580" width="520" height="140" rx="22" fill="url(#block-accent)"/>
    <text x="640" y="610" font-family="Inter" font-size="14" font-weight="700" fill="#ffffff">Quality Presets · config/quality.ts</text>
    <text x="640" y="634" font-family="Inter" font-size="11" fill="#e7eaee">high · balanced · battery</text>
    <text x="640" y="652" font-family="Inter" font-size="11" fill="#e7eaee">→ pixel ratio cap · bloom strength · shadows</text>
    <text x="640" y="670" font-family="Inter" font-size="11" fill="#e7eaee">→ artwork geometry segments</text>
    <text x="640" y="690" font-family="Inter" font-size="11" fill="#e7eaee">Subscribed by Renderer · PostProcessing · Lighting · ArtworkMesh</text>
  </g>

  <!-- Connections -->
  <g stroke="#3a4750" stroke-width="2" fill="none" marker-end="url(#arrow)" opacity="0.7">
    <path d="M340 230 L340 270"/>
    <path d="M520 230 L520 270"/>
    <path d="M920 230 L520 270"/>
    <path d="M200 230 L200 270"/>
    <path d="M330 550 L330 580"/>
    <path d="M880 550 L880 580"/>
  </g>
</svg>
