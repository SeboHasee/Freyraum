<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="description" content="FREYRAUM — Immersive Digital Exhibition Platform">
  <title>freyraum — immersive gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
  </noscript>
</head>
<body>
  <div id="app"></div>
  <noscript>
    <p>Für FREYRAUM wird JavaScript benötigt. Bitte aktivieren Sie JavaScript und laden Sie die Seite neu.</p>
  </noscript>
  <!-- v0.75: customer artwork/audio globals — generated by scripts/import-artworks.mjs.
       Files live in public/ (gitignored; regenerated by `npm run import:artworks`).
       Absolute paths are intentional: Vite rewrites /foo.js → /Freyraum/foo.js at build
       time (base: '/Freyraum/') while keeping them as /foo.js in dev mode.
       Missing files are handled gracefully: main.ts falls back to built-in artworks. -->
  <script src="/customer-artworks.js"></script>
  <script src="/customer-audio.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
